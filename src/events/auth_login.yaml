http.post./auth/login:
  fn: auth_login
  body:
    content:
      application/json:
        schema:
          type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
              description: Username or email
            password:
              type: string
              description: User password
          additionalProperties: false
  responses:
    200:
      description: Login successful
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [admin, user]
                  token:
                    type: string
                  expiresIn:
                    type: string
    400:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              message:
                type: string
    401:
      description: Invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              message:
                type: string
