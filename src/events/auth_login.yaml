http.post./auth/login:
  summary: User login
  description: Authenticate user with username/email and password
  fn: auth_login
  body:
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
              description: Username or email address
            password:
              type: string
              description: User password
          required:
            - username
            - password
  responses:
    200:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              message:
                type: string
              data:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [admin, user]
                  token:
                    type: string
                  expiresIn:
                    type: string
    400:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              message:
                type: string
              data:
                type: object
    401:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              message:
                type: string
              data:
                type: object
