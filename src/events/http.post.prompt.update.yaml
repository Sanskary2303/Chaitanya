http.post./prompt/update:
  fn: update_prompt
  summary: Update current prompt
  description: Updates the current user prompt/message  
  body:
    content:
      application/json:
        schema:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: The updated prompt message
  responses:
    200:
      description: Prompt updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    400:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
