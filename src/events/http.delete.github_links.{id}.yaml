http.delete./github_links/{id}:
  fn: delete_github_link
  summary: Delete a GitHub repository link
  description: Removes a GitHub repository from the vector store and metadata
  params:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    200:
      description: Successfully deleted GitHub repository
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
    400:
      description: Error deleting repository
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              message:
                type: string
    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
