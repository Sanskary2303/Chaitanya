http.post./auth/register:
  fn: auth_register
  body:
    content:
      application/json:
        schema:
          type: object
          required:
            - username
            - email
            - password
          properties:
            username:
              type: string
              description: Unique username
              minLength: 3
              maxLength: 50
            email:
              type: string
              format: email
              description: User email address
            password:
              type: string
              description: User password
              minLength: 6
            role:
              type: string
              enum: [admin, user]
              description: User role (defaults to 'user')
          additionalProperties: false
  responses:
    201:
      description: User registered successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [admin, user]
                  token:
                    type: string
                  expiresIn:
                    type: string
    400:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              message:
                type: string
    409:
      description: User already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              message:
                type: string
