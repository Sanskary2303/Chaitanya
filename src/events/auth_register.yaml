http.post./auth/register:
  summary: User registration
  description: Register a new user account
  fn: auth_register
  body:
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
              description: Unique username
            email:
              type: string
              format: email
              description: User email address
            password:
              type: string
              description: User password (minimum 6 characters)
            role:
              type: string
              enum: [admin, user]
              description: User role (optional, defaults to user)
          required:
            - username
            - email
            - password
  responses:
    201:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              message:
                type: string
              data:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [admin, user]
                  token:
                    type: string
                  expiresIn:
                    type: string
    400:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              message:
                type: string
              data:
                type: object
    409:
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              message:
                type: string
              data:
                type: object
