http:
  get: /system-prompts
summary: List system prompts
description: Get a list of system prompts with optional filtering and pagination
fn: prompt_management.list_system_prompts
params:
  - name: category
    in: query
    required: false
    schema:
      type: string
    description: Filter by category
  - name: isActive
    in: query
    required: false
    schema:
      type: string
      enum: ["true", "false"]
    description: Filter by active status
  - name: search
    in: query
    required: false
    schema:
      type: string
    description: Search in name, description, or content
  - name: includeContent
    in: query
    required: false
    schema:
      type: string
      enum: ["true", "false"]
    description: Include full prompt content in response
    default: "false"
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  - name: offset
    in: query
    required: false
    schema:
      type: integer
      minimum: 0
      default: 0
responses:
  200:
    description: List of system prompts
  500:
    description: Internal server error
